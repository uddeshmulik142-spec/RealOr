workflows:
  ios-free-build:
    name: RealOr Free iOS Build
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform ios
      - name: Build Unsigned IPA
        script: |
          cd ios
          # Build directly to a known folder path
          xcodebuild -workspace $(ls -d *.xcworkspace) -scheme RealOr -configuration Release -derivedDataPath derivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""

          # Locate the built .app product inside DerivedData
          mkdir -p build/Payload
          APP_PATH=$(find derivedData -name "RealOr.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ../../RealOr.ipa Payload
    artifacts:
      - RealOr.ipa
