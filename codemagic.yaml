workflows:
  ios-free-build:
    name: RealOr Free iOS Build
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild & Patch Podfile
        script: |
          set -e

          # Generate the native project without running CocoaPods yet.
          npx expo prebuild --platform ios --no-install

          if [ ! -f "ios/Podfile" ]; then
            echo "Error: ios/Podfile not found after prebuild"
            exit 1
          fi

          cat << 'EOF' > patch.rb
          path = 'ios/Podfile'
          content = File.read(path)
          marker = '# RealOr NitroModules header search paths'

          unless content.include?(marker)
            hook = "post_install do |installer|"
            unless content.include?(hook)
              abort "Error: post_install hook not found in ios/Podfile"
            end

            patch = <<~'PATCH'
              # RealOr NitroModules header search paths
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  search_paths = config.build_settings['HEADER_SEARCH_PATHS']
                  search_paths = ['$(inherited)'] if search_paths.nil?
                  search_paths = [search_paths] unless search_paths.is_a?(Array)
                  search_paths |= [
                    '"$(PODS_ROOT)/Headers/Public/react-native-nitro-modules"',
                    '"$(PODS_ROOT)/../../node_modules/react-native-nitro-modules/cpp"',
                  ]
                  config.build_settings['HEADER_SEARCH_PATHS'] = search_paths
                end
              end
            PATCH

            content.sub!(hook, "#{hook}\n#{patch}")
            File.write(path, content)
          end
          EOF
          ruby patch.rb
          rm patch.rb
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install --repo-update
      - name: Build Unsigned IPA
        script: |
          set -euo pipefail

          if [ ! -d "ios" ]; then
            echo "Error: ios directory not found"
            exit 1
          fi

          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1 || true)

          if [ -z "$WORKSPACE" ]; then
            echo "CRITICAL ERROR: No .xcworkspace found! Here is what is inside the ios directory:"
            ls -la
            exit 1
          fi

          echo "Using workspace: $WORKSPACE"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme RealOr \
            -configuration Release \
            -archivePath build/RealOr.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          mkdir -p build/Payload
          cp -R build/RealOr.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ../../RealOr.ipa Payload
          cd ../..
          test -s RealOr.ipa || (echo "RealOr.ipa was not generated" && exit 1)
    artifacts:
      - RealOr.ipa
