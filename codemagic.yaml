workflows:
  ios-free-build:
    name: RealOr Free iOS Build
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform ios
      - name: Build Unsigned IPA
        script: |
          cd ios
          # Force Xcode to build for generic iOS device destination into an explicit output path
          xcodebuild -workspace $(ls -d *.xcworkspace) -scheme RealOr -configuration Release -destination "generic/platform=iOS" -derivedDataPath build/derivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""

          # Find and package the app bundle
          mkdir -p build/Payload
          APP_PATH=$(find build/derivedData -name "RealOr.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"

          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r ../../RealOr.ipa Payload
    artifacts:
      - RealOr.ipa
