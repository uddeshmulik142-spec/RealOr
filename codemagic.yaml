workflows:
  ios-free-build:
    name: RealOr Free iOS Build
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform ios
      - name: Build Unsigned IPA
        script: |
          set -euo pipefail
          cd ios
          xcodebuild archive \
            -workspace $(ls -d *.xcworkspace) \
            -scheme RealOr \
            -configuration Release \
            -archivePath build/RealOr.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          mkdir -p build/Payload
          APP_PATH=build/RealOr.xcarchive/Products/Applications/RealOr.app
          if [ ! -d "$APP_PATH" ]; then
            echo "Build completed without producing RealOr.app in the archive." >&2
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          test -d build/Payload/RealOr.app
          cd build
          zip -r ../../RealOr.ipa Payload
          cd ../..
          test -s RealOr.ipa
    artifacts:
      - RealOr.ipa
