workflows:
  ios-free-build:
    name: RealOr Free iOS Build
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform ios
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          if [ ! -f "ios/Podfile" ]; then
            echo "Error: ios/Podfile not found after prebuild"
            exit 1
          fi
          cd ios
          pod install
          WORKSPACE=$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: CocoaPods did not generate an Xcode workspace"
            exit 1
          fi
          echo "Generated workspace: $WORKSPACE"
      - name: Build Unsigned IPA
        script: |
          set -euo pipefail

          # Verify ios directory exists
          if [ ! -d "ios" ]; then
            echo "Error: ios directory not found after prebuild"
            exit 1
          fi

          cd ios
          WORKSPACE=$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: Xcode workspace not found after CocoaPods installation"
            exit 1
          fi
          echo "Using workspace: $WORKSPACE"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme RealOr \
            -configuration Release \
            -archivePath build/RealOr.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          mkdir -p build/Payload
          cp -R build/RealOr.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ../../RealOr.ipa Payload
          cd ../..
          test -s RealOr.ipa || (echo "RealOr.ipa was not generated" && exit 1)
    artifacts:
      - RealOr.ipa
