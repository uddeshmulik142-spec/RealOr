name: Build unsigned iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/RealOr.xcworkspace \
            -scheme RealOr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RealOr.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package app as IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto build/RealOr.xcarchive/Products/Applications/RealOr.app \
            build/ipa/Payload/RealOr.app
          cd build/ipa
          zip -r RealOr.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: realor-ios-unsigned-ipa
          path: build/ipa/RealOr.ipa
          if-no-files-found: error
          retention-days: 14
